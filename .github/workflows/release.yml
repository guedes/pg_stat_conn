name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-server-dev-${{ matrix.pg }}

      - name: Build pg_stat_conn
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          make USE_PGXS=1 PG_CONFIG=$PG_CONFIG

      - name: Package binaries
        env:
          TAG: ${{ github.ref_name }}
          PG_VERSION: ${{ matrix.pg }}
        run: |
          pkg="pg_stat_conn-${TAG}-pg${PG_VERSION}-linux-amd64"
          mkdir "$pkg"
          cp pg_stat_conn.so pg_stat_conn.control pg_stat_conn--*.sql "$pkg"/
          tar -czf "$pkg.tar.gz" "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_stat_conn-pg${{ matrix.pg }}-linux-amd64
          path: pg_stat_conn-*-pg${{ matrix.pg }}-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
